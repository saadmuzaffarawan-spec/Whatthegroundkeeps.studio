<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHAT THE GROUND KEEPS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=VT323&display=swap" rel="stylesheet">
    <style>
        /* ── RESET & BASE ── */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #050508;
            color: #e8edf5;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* Locked screen for app-like feel */
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── BACKGROUND CANVAS ── */
        #ascii-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center bottom;
            z-index: 1;
            filter: blur(4px); /* Subtle blur applied to the background */
        }

        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.15) 50%, rgba(0,0,0,0.15));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 2;
        }

        /* ── MAIN UI OVERLAY ── */
        main {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: radial-gradient(circle at center, rgba(5,5,8,0.4) 0%, rgba(5,5,8,0.1) 100%);
        }

        .container {
            max-width: 720px;
            width: 100%;
            background: rgba(12, 16, 20, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(166, 108, 55, 0.15); /* Shifted to brown tint */
            border-radius: 2.5rem;
            padding: 3.5rem 2.5rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(166, 108, 55, 0.05) inset;
            text-align: center;
            transition: box-shadow 0.3s ease;
        }

        .container:hover {
            box-shadow: 0 40px 80px rgba(20, 10, 0, 0.9), 0 0 0 2px rgba(166, 108, 55, 0.2) inset;
        }

        .title {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-family: 'VT323', monospace;
            font-weight: 400;
            letter-spacing: 2px;
            line-height: 1.1;
            /* White to earthy light brown gradient */
            background: linear-gradient(135deg, #ffffff 0%, #e6d0b3 50%, #c19a6b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(193, 154, 107, 0.2);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            font-weight: 400;
            letter-spacing: 0.1em;
            color: #d2b48c; /* Earthy tan/white color */
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        /* ── WAITLIST FORM ── */
        .waitlist-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 500px;
            margin: 0 auto;
        }

        .waitlist-input {
            flex-grow: 1;
            background: rgba(10, 5, 0, 0.6);
            border: 1px solid rgba(166, 108, 55, 0.2);
            border-radius: 60px;
            color: #FFF;
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            padding: 1.2rem 1.5rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .waitlist-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .waitlist-input:focus {
            border-color: rgba(166, 108, 55, 0.8);
            box-shadow: 0 0 20px rgba(166, 108, 55, 0.15);
            background: rgba(10, 5, 0, 0.8);
        }

        .waitlist-btn {
            display: inline-block;
            padding: 1.2rem 3rem;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #ffffff;
            background: linear-gradient(135deg, #A66C37 0%, #593512 100%);
            border: none;
            border-radius: 60px;
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1);
            box-shadow: 0 8px 30px rgba(139, 90, 43, 0.3);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }

        /* Shine sweep animation */
        .waitlist-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            z-index: 1;
        }

        /* Subtle radial glow */
        .waitlist-btn::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            z-index: 0;
        }

        .waitlist-btn:hover:not(:disabled) {
            transform: scale(1.04);
            box-shadow: 0 12px 40px rgba(139, 90, 43, 0.5);
            background: linear-gradient(135deg, #C28247 0%, #6E4217 100%);
        }

        .waitlist-btn:hover:not(:disabled)::before {
            animation: shine 1.5s infinite;
        }

        .waitlist-btn:hover:not(:disabled)::after {
            opacity: 1;
        }

        .waitlist-btn:active:not(:disabled) {
            transform: scale(0.96);
        }

        .waitlist-btn:disabled {
            background: #3a2a1a;
            color: #8a7a6a;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        .message {
            margin-top: 20px;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: none;
        }

        /* ── INFO BADGES ── */
        .info {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            flex-wrap: wrap;
            font-size: 0.95rem;
            color: #d2b48c;
            margin-top: 2.5rem;
            border-top: 1px solid rgba(166, 108, 55, 0.2);
            padding-top: 1.8rem;
        }
        
        .info span {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .info i {
            font-style: normal;
            font-weight: 300;
            opacity: 0.85;
            color: #e8edf5;
        }

        @media (min-width: 540px) {
            .waitlist-form {
                flex-direction: row;
            }
        }

        @media (max-width: 640px) {
            .info {
                flex-direction: column;
                gap: 1rem;
                align-items: center;
            }
            .container {
                padding: 2.5rem 1.5rem;
            }
        }

        /* ── FOOTER ── */
        footer {
            position: relative;
            z-index: 10;
            padding: 20px;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- BACKGROUND -->
    <canvas id="ascii-canvas" width="1280" height="720"></canvas>
    <div class="scanlines"></div>

    <!-- UI -->
    <main>
        <div class="container">
            <h1 class="title">WHAT THE GROUND KEEPS</h1>
            <p class="subtitle">A 3D ASCII WORLD.<br>Join the waitlist to get early access.</p>
            
            <form class="waitlist-form" id="waitlistForm" onsubmit="handleWaitlist(event)">
                <input type="email" id="emailInput" class="waitlist-input" placeholder="Enter your email" required>
                <button type="submit" id="submitBtn" class="waitlist-btn">⭐ WISHLIST</button>
            </form>
            <div id="waitlistResponse" class="message"></div>

            <div class="info">
                <span>🎮 <i>Coming to PC</i></span>
                <span>🌧️ <i>Immersive 3D ASCII world</i></span>
                <span>👻 <i>Survive the unknown</i></span>
            </div>
        </div>
    </main>

    <footer>
        © 2026 WHAT THE GROUND KEEPS. ALL RIGHTS RESERVED.
    </footer>

    <!-- LOGIC -->
    <script>
        async function handleWaitlist(event) {
            event.preventDefault();
            
            const form = document.getElementById('waitlistForm');
            const emailInput = document.getElementById('emailInput');
            const submitBtn = document.getElementById('submitBtn');
            const responseDiv = document.getElementById('waitlistResponse');
            
            const email = emailInput.value.trim();
            if (!email) return;

            // Loading state
            submitBtn.disabled = true;
            submitBtn.textContent = 'WISHLISTING...';
            emailInput.disabled = true;
            responseDiv.style.display = 'none';
            
            try {
                const response = await fetch('https://ynipxef2qazvhvwhicerjcfqei0xkxin.lambda-url.us-east-1.on.aws/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: email })
                });

                if (!response.ok) {
                    throw new Error('Server returned an error');
                }

                const data = await response.json();
                
                if (data.success) {
                    // Success state
                    form.style.display = 'none';
                    responseDiv.style.display = 'block';
                    responseDiv.style.color = '#e6d0b3';
                    responseDiv.textContent = data.message || 'Uplink secured. You are on the list.';
                    emailInput.value = '';
                } else {
                    throw new Error('Submission failed');
                }
            } catch (error) {
                // Error state
                console.error('Waitlist error occurred.');
                responseDiv.style.display = 'block';
                responseDiv.style.color = '#ff6b6b';
                responseDiv.textContent = 'Failed to join waitlist. Please try again.';
                
                // Reset form state to allow retry
                submitBtn.disabled = false;
                submitBtn.textContent = '⭐ WISHLIST';
                emailInput.disabled = false;
                emailInput.focus();
            }
        }

        // =========================================================
        // ASCII CANVAS RENDERING LOGIC (PRESERVED)
        // =========================================================
        const canvas = document.getElementById('ascii-canvas');
        const ctx = canvas.getContext('2d');
        
        const LOGICAL_W = 1280;
        const LOGICAL_H = 720;
        const CELL_W = 18;
        const CELL_H = 28;

        const sceneStr = [
            "            &",
            "          &&&",
            "         &&&&&",
            "        &&&&&&&",
            "       &&&&&&&&&",
            "      &&&&&&&&&&&",
            "     &&&&&&&&&&&&&",
            "    &&&&&&&&&&&&&&&",
            "   &&&&&&&&&&&&&&&&&",
            "  &&&&&&&&&&&&&&&&&&&",
            "  &&&&&&&&&&&&&&&&&&&",
            "   &&&&&&&&&&&&&&&&&",
            "    &&&&&&&&&&&&&&&",
            "         ||||||",
            "         ||||||",
            "         ||||||",
            "         ||||||",
            "         ||||||",
            "############################################################################",
            "############################################################################",
            "############################################################################",
            "############################################################################",
            "############################################################################"
        ];

        const stars = [];
        for(let i=0; i<200; i++) {
            stars.push({
                x: 20 + Math.random() * (LOGICAL_W - 40),
                y: 30 + Math.random() * 350,
                phase: Math.random() * Math.PI * 2,
                bright: 0.4 + Math.random() * 0.6,
                big: Math.random() < 0.2
            });
        }

        const clamp = (val, min, max) => Math.max(min, Math.min(max, val));

        function drawFrame(timeMs) {
            const time = timeMs / 1000.0; 
            
            ctx.fillStyle = `rgb(5, 5, 8)`;
            ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
            
            ctx.font = `${CELL_H - 4}px 'VT323', monospace`;
            ctx.textBaseline = 'top';

            const ORIGIN_X = 0;
            const ORIGIN_Y = LOGICAL_H - (23 * CELL_H);
            const groundTopY = ORIGIN_Y + 18 * CELL_H;

            // Stars
            for(let s of stars) {
                let tw = 0.5 + 0.5 * Math.sin(time * 1.8 + s.phase);
                ctx.fillStyle = `rgba(255, 255, 255, ${tw * s.bright})`;
                ctx.font = `${s.big ? 16 : 12}px 'VT323', monospace`;
                ctx.fillText(s.big ? '*' : '.', s.x, s.y);
            }

            ctx.font = `${CELL_H - 4}px 'VT323', monospace`;

            const campX = ORIGIN_X + 26 * CELL_W;
            const campY = groundTopY - CELL_H + 8;
            const fireFlicker = (Math.sin(time * 12.0) + Math.cos(time * 7.0) + 2.0) * 0.25;
            const fireRadius = 350.0 + fireFlicker * 60.0; 

            // Draw Scene background trees/ground with saturated vibrant fire lighting
            for (let row = 0; row < 23; row++) {
                const line = sceneStr[row];
                const yPos = ORIGIN_Y + row * CELL_H;

                for (let col = 0; col < line.length; col++) {
                    const ch = line[col];
                    if (ch === ' ') continue;

                    let wx = ORIGIN_X + col * CELL_W;
                    if (ch === '&') {
                        let sway = Math.sin(time * 1.5 + row * 0.3 + col * 0.1) * 6.0;
                        wx += sway;
                    }

                    let distToCamp = Math.hypot(wx - campX, yPos - campY);
                    let campLight = clamp(1.0 - (distToCamp / fireRadius), 0.0, 1.0);
                    campLight = Math.pow(campLight, 1.5); 

                    let r = 25, g = 32, b = 48;
                    if (ch === '&') { r = 18; g = 65; b = 35; } 
                    if (ch === '|') { r = 70; g = 45; b = 25; } 
                    if (ch === '#') {
                        let depth = row - 18;
                        r = 45 - (depth * 5); g = 35 - (depth * 5); b = 50 - (depth * 5);
                    }

                    r += campLight * 230;
                    g += campLight * 120;
                    b += campLight * 30;

                    r = clamp(r, 0, 255); 
                    g = clamp(g, 0, 255); 
                    b = clamp(b, 0, 255);
                    
                    ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                    ctx.fillText(ch, wx, yPos);
                }
            }

            // Expanded Warm Campfire Glow Halo layer
            let glowGrad = ctx.createRadialGradient(campX + CELL_W/2, campY + CELL_H/2, 5, campX + CELL_W/2, campY + CELL_H/2, fireRadius * 0.8);
            glowGrad.addColorStop(0, `rgba(255, 140, 20, ${0.35 + fireFlicker * 0.1})`);
            glowGrad.addColorStop(0.5, `rgba(200, 70, 10, ${0.15 + fireFlicker * 0.05})`);
            glowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.arc(campX + CELL_W/2, campY + CELL_H/2, fireRadius * 0.8, 0, Math.PI * 2);
            ctx.fill();

            // Campfire Core
            ctx.fillStyle = `rgb(255, ${120 + fireFlicker * 135}, 10)`;
            ctx.font = `32px 'VT323', monospace`;
            ctx.fillText("W", campX, campY);
            ctx.fillStyle = `#FFD700`;
            ctx.font = `24px 'VT323', monospace`;
            ctx.fillText("*", campX + 5, campY - 20 - (fireFlicker * 15));

            let isMobile = window.innerWidth <= 600;
            let canvasSpan = isMobile ? LOGICAL_W - 100 : LOGICAL_W - 250;
            let speedMultiplier = isMobile ? 0.35 : 0.5;

            // --- @ and i slowly moving across the screen naturally ---
            let walkCycle = (Math.sin(time * speedMultiplier) + 1.0) * 0.5; 
            let wanderX = walkCycle * canvasSpan + 80;
            let hopOffset = Math.abs(Math.sin(time * 6.0)) * 10.0;
            let entityY = groundTopY - CELL_H + 2 - hopOffset;

            // Hat/Indicator "^" over their heads
            ctx.fillStyle = `#00FFCC`;
            ctx.font = `20px 'VT323', monospace`;
            ctx.fillText("^", wanderX + 2, entityY - 20);
            ctx.fillText("^", wanderX + 26, entityY - 20);

            // Player (@)
            ctx.fillStyle = `#FFFFFF`;
            ctx.font = `${CELL_H}px 'VT323', monospace`;
            ctx.fillText("@", wanderX, entityY);

            // Sibling (i) walking right beside player
            let siblingX = wanderX + 24;
            ctx.font = `38px 'VT323', monospace`;
            ctx.fillText("i", siblingX, entityY - 4);

            // --- Separate Heart Animation ---
            const heartAscii = [
                "d88b  d88b",
                "888888888888",
                "Y8888888888Y",
                " Y88888888Y ",
                "  `Y8888Y`  ",
                "   `YY`   "
            ];
            let heartPulse = (Math.sin(time * 4.0) + 1.0) * 0.5;
            let heartX = isMobile ? LOGICAL_W * 0.5 : LOGICAL_W * 0.48; 
            let heartY = 150 + Math.sin(time * 2.5) * 8.0;
            ctx.fillStyle = `rgba(255, ${60 + heartPulse * 120}, 90, 0.9)`;
            ctx.font = `16px 'VT323', monospace`;
            heartAscii.forEach((line, idx) => {
                ctx.fillText(line, heartX - 40, heartY + (idx * 15));
            });

            // --- EXACT ENEMIES ROAMING ---
            ctx.font = `${CELL_H}px 'VT323', monospace`;
            
            // Spitter enemy 'v'
            let spitterX = (time * 35) % (LOGICAL_W - 150) + 80;
            ctx.fillStyle = `#32CD32`; 
            ctx.fillText("v", spitterX, groundTopY - CELL_H + 2);

            // Mimic trap 'm' disguised as gold '$'
            let mimicX = isMobile ? 250 : 450;
            ctx.fillStyle = `#FFD700`; 
            ctx.fillText("$", mimicX, groundTopY - CELL_H + 2);

            // Crawling Worm Segment 'S'
            let wormHeadX = LOGICAL_W - ((time * 55) % LOGICAL_W);
            ctx.fillStyle = `#FF4500`; 
            ctx.fillText("S", wormHeadX, groundTopY - CELL_H + 2);
            ctx.fillStyle = `#8B0000`;
            ctx.fillText("~", wormHeadX - 18, groundTopY - CELL_H + 2);

            requestAnimationFrame(drawFrame);
        }

        document.fonts.ready.then(() => {
            requestAnimationFrame(drawFrame);
        });
    </script>
</body>
</html>
